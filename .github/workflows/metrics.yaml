name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate METRICS_TOKEN
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Configure o secret METRICS_TOKEN com um GitHub Personal Access Token valido."
            exit 1
          fi

          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $METRICS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)

          if [ "$status" != "200" ]; then
            echo "::error::O secret METRICS_TOKEN esta invalido, expirado ou revogado. Gere um novo token e atualize o secret."
            exit 1
          fi

      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: RafaelEh96
          template: classic
          base: header, community, repositories, metadata
          config_timezone: America/Sao_Paulo

          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

          plugin_habits: yes
          plugin_habits_facts: yes

          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact

          plugin_lines: yes
