name: Metrics
on:
  # Agenda para rodar todo dia à meia-noite
  schedule:
    - cron: "0 0 * * *"
  # Permite que você execute manualmente na aba Actions
  workflow_dispatch:
  # Roda sempre que você fizer um push na main ou master
  push:
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: RafaelEh96
          template: classic
          base: header, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_lines: yes